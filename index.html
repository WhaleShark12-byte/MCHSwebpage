<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.T.O.P. Safety</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #111;
            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 40px 20px;
            text-align: center;
        }

        .stop-link {
            display: inline-block;
            text-decoration: none;
            transition: transform 0.25s ease, filter 0.25s ease;
        }

        .stop-link:hover {
            transform: scale(1.05);
            filter: brightness(1.15);
        }

        .stop-image {
            display: block;
            width: 260px;
            max-width: 80vw;
            height: auto;
            margin: 0 auto 30px;
        }

        h1 {
            margin: 0 0 15px;
            font-size: 2.4rem;
            color: #ffcc00;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #ddd;
            max-width: 700px;
            margin: 0 auto 25px;
        }

        .button {
            display: inline-block;
            padding: 14px 28px;
            background: #e21b23;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .button:hover {
            background: #ff3333;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 40px;
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>

<body>

    <main class="container">

        <!-- CLICKABLE STOP IMAGE -->
        <a
            class="stop-link"
            href="YOUR-LINK-HERE"
            target="_blank"
            rel="noopener noreferrer"
        >
            <img
                class="stop-image"
                src="stop.png"
                alt="S.T.O.P. Safety Hotline, Online Prevention, Bullying, Violence and Risky Behavior"
            >
        </a>

        <h1>S.T.O.P.</h1>

        <p>
            Safety, prevention, and support for bullying, violence,
            and risky behavior. Click the S.T.O.P. logo above to
            access the linked resource.
        </p>

        <!-- OPTIONAL BUTTON TO THE SAME LINK -->
        <a
            class="button"
            href="YOUR-LINK-HERE"
            target="_blank"
            rel="noopener noreferrer"
        >
            Learn More
        </a>

        <footer>
            &copy; 2026 S.T.O.P. Safety & Prevention
        </footer>

    </main>

</body>
</html>
